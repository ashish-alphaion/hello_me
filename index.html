<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      main {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }

      button {
        padding: 14px 26px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover { background: #1d4ed8; }

      #wedding-video {
        display: none;
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
      }

      #wedding-video:fullscreen,
      #wedding-video:-webkit-full-screen {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #wedding-video.video-fallback {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <main>
      <button type="button" onclick="window.location.href='invitation.html'">
        Open Invitation
      </button>
      <button id="video-button" type="button">
        Watch Video
      </button>
      <button
        type="button"
        onclick="window.location.href='https://www.google.com/maps/dir/?api=1&amp;destination=22.03471419646733%2C87.16992803664122&amp;travelmode=driving'"
      >
        Get Directions
      </button>
    </main>

    <video id="wedding-video" controls preload="auto">
      <source src="img/vid1.mp4" type="video/mp4" />
      Your browser does not support HTML video.
    </video>

    <script>
      const video = document.getElementById("wedding-video");
      const videoButton = document.getElementById("video-button");

      videoButton.addEventListener("click", () => {
        video.muted = false;
        video.volume = 1;
        video.currentTime = 0;
        video.classList.add("video-fallback");

        video.play().catch(() => {
          video.controls = true;
        });

        const openFullscreen =
          video.requestFullscreen?.bind(video) ||
          video.webkitRequestFullscreen?.bind(video) ||
          video.webkitEnterFullscreen?.bind(video);

        if (openFullscreen) {
          try {
            const result = openFullscreen();
            result?.catch?.(() => {});
          } catch (_) {
            // The fixed full-window player remains available as a fallback.
          }
        }
      });

      video.addEventListener("ended", () => {
        video.classList.remove("video-fallback");
      });
    </script>
  </body>
</html>
